<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Register</title><link rel="stylesheet" href="styles.css" /></head><body><main class="auth-shell"><section class="auth-card"><h1>Create account</h1><form id="registerForm" novalidate><label for="registerUsername">Username</label><input id="registerUsername" type="text" placeholder="Enter username" /><label for="registerEmail">Email</label><input id="registerEmail" type="email" placeholder="Enter email" /><label for="registerPassword">Password</label><input id="registerPassword" type="password" placeholder="Enter password" /><button type="submit">Register</button></form><p class="switch-link">Already have an account? <a href="login.html">Login here</a></p><p id="registerMessage" class="message"></p></section></main><script src="script.js"></script></body></html>
