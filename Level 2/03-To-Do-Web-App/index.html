<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>To-Do App</title><link rel="stylesheet" href="styles.css" /></head><body><main class="app"><section class="todo-card"><h1>My To-Do List</h1><form id="todoForm" class="todo-form"><input id="todoInput" type="text" placeholder="Add a task..." aria-label="Task name" /><button type="submit">Add Task</button></form><div class="lists"><section class="list-panel"><div class="list-header"><h2>Pending Tasks</h2><span id="pendingCount">0 pending</span></div><ul id="pendingList" class="task-list"></ul><p id="pendingEmpty" class="empty-state">No pending tasks. Relax and enjoy your day.</p></section><section class="list-panel"><div class="list-header"><h2>Completed Tasks</h2><span id="completedCount">0 completed</span></div><ul id="completedList" class="task-list"></ul><p id="completedEmpty" class="empty-state">No completed tasks yet.</p></section></div></section></main><script src="script.js"></script></body></html>
